name: Build iOS IPA

# Builds an unsigned Vorn.ipa (sideload with Sideloadly / AltStore / TrollStore ...).
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.2"
  APP_NAME: Vorn

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the iOS export template
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$HOME/godot"
          curl -fL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TDIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d "$TDIR"
          rm -f godot.zip templates.tpz
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Export the Xcode project from Godot
        run: |
          set -euo pipefail
          # Godot wants a 10-character team ID even for an unsigned build.
          sed -i '' "s/__TEAM_ID__/0000000000/g" export_presets.cfg
          "$GODOT" --headless --path . --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" "build/ios/${APP_NAME}.ipa"
          test -d "build/ios/${APP_NAME}.xcodeproj"
          test -f "build/ios/${APP_NAME}.pck"

      - name: Build the app (unsigned)
        run: |
          set -uo pipefail
          PROJ="build/ios/${APP_NAME}.xcodeproj"
          ls -d /Applications/Xcode*.app || true
          DEFAULT_X="$(xcode-select -p | sed 's#/Contents/Developer##')"
          NEWEST_X="$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          OK=0
          TRIED=""
          # Newest stable Xcode first (the engine library may be built with a recent SDK), then the runner default.
          for X in "$NEWEST_X" "$DEFAULT_X"; do
            if [ -z "$X" ] || [ ! -d "$X" ] || [ "$X" = "$TRIED" ]; then continue; fi
            TRIED="$X"
            echo "=== xcodebuild with $X"
            export DEVELOPER_DIR="$X/Contents/Developer"
            xcodebuild -version
            rm -rf build/dd
            if xcodebuild -quiet -project "$PROJ" -scheme "$APP_NAME" -configuration Release -sdk iphoneos \
                 -destination "generic/platform=iOS" -derivedDataPath build/dd \
                 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
                 | tee "build/xcodebuild-$(basename "$X").log" | tail -n 120; then
              OK=1
              echo "=== build succeeded with $X"
              break
            fi
            echo "=== build failed with $X"
          done
          [ "$OK" = "1" ]

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find build/dd/Build/Products -maxdepth 2 -name "*.app" -path "*Release-iphoneos*" | head -1)"
          if [ -z "$APP" ]; then echo "App bundle not found"; find build/dd/Build/Products -maxdepth 3; exit 1; fi
          ls -la "$APP" | head -40
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qr "../${APP_NAME}.ipa" Payload)
          ls -la "build/${APP_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vorn-iOS
          path: build/Vorn.ipa
          if-no-files-found: error

      - name: Publish the IPA as the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "build/${APP_NAME}.ipa" --target "${GITHUB_SHA}" \
            --title "Vorn — iOS" \
            --notes "Unsigned IPA built automatically from commit ${GITHUB_SHA}. Install it with a sideloading tool (Sideloadly, AltStore, TrollStore ...)."
