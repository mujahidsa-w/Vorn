name: Vexo iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create --project-name vexo --org com.vexoapp --platforms ios .

      - run: flutter pub get

      - name: Generate Flutter config and Podfile
        run: flutter build ios --config-only --release --no-codesign

      - name: Configure permissions and iOS version
        run: |
          test -f ios/Podfile || { echo "ios/Podfile missing"; exit 1; }
          plutil -insert NSMicrophoneUsageDescription -string "Vexo uses the microphone for voice messages." ios/Runner/Info.plist
          sed -i '' 's/# platform :ios, .*/platform :ios, '\''15.0'\''/' ios/Podfile

      - name: Install pods
        run: cd ios && pod install

      - name: Build app with xcodebuild (no signing)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/Runner.app
          test -d "$APP" || { echo "Runner.app not found"; find build/ios -maxdepth 4 -name "*.app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr vexo-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vexo-ios-unsigned-ipa
          path: vexo-unsigned.ipa
