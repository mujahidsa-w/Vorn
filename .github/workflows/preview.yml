name: Dev preview (models check and screenshots)

# Development check for the optics and the lobby: it needs the unpacked character and weapon models,
# which exist only on the build machine. Runs on the claude/* work branches.
on:
  push:
    branches: ["claude/**"]
    paths: ["game/**", "tools/preview/**", ".github/workflows/preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.2"

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          rm -f godot.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null

      - name: Unpack models, animations and sounds from the original game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _orig
          URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].assets[] | select(.name | test("fable.?strike.*\\.(zip|rar|exe|pck)$"; "i"))] | sort_by(.size) | last | .url // empty')"
          test -n "$URL"
          gh api -H "Accept: application/octet-stream" "$URL" > _orig/pack.bin
          SRC="_orig/pack.bin"
          if [ "$(head -c 2 "$SRC")" = "PK" ]; then
            unzip -q -o "$SRC" -d _orig/zip
            rm -f _orig/pack.bin
            SRC="$(find _orig/zip -type f -size +300M \( -iname '*.rar' -o -iname 'FableStrike2.exe' -o -iname '*.pck' \) | head -1)"
          fi
          if [ "$(head -c 4 "$SRC")" = "Rar!" ]; then
            (cd tools/unpack && npm install --no-save --silent node-unrar-js@2.0.2)
            node tools/unpack/unrar.mjs "$SRC" _orig/rar
            SRC="$(find _orig/rar -type f -size +300M -iname 'FableStrike2.exe' | head -1)"
          fi
          "$GODOT" --headless --path tools/unpack --script unpack_assets.gd -- "$PWD/$SRC" "$PWD"
          rm -rf _orig tools/unpack/node_modules

      - name: Import
        run: '"$GODOT" --headless --path . --import > /dev/null 2>&1 || true'

      - name: Weapon geometry
        run: '"$GODOT" --headless --path . --script res://tools/preview/dump.gd 2>&1 | grep -vE "^(Godot Engine|$)" | head -400 || true'

      - name: Screenshots
        run: |
          set -uo pipefail
          mkdir -p shots
          R="xvfb-run -a -s '-screen 0 1280x720x24'"
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x720 -- \
            --nosplash --windowed --mute --nosave --shots shots --quit_menu 2>&1 | grep -E "SHOT|ERROR|SCRIPT" | head -40 || true
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x720 -- \
            --match --vmtest "${VMLIST:-ak,m4,awp,shotgun,mp9,mac10,glock,usp,deagle}" --vmads --windowed --mute --nosave --shots shots 2>&1 | grep -E "SHOT|ERROR|SCRIPT|SIGHT" | head -80 || true
          ls shots

      - name: Contact sheets (small, printed for the dev session)
        run: |
          set -uo pipefail
          cd shots
          sheet() {
            name="$1"; shift; geo="$1"; shift; crop="$1"; shift
            files=""
            for f in "$@"; do
              [ -f "$f.png" ] || continue
              if [ "$crop" = "1" ]; then convert "$f.png" -gravity center -crop 50%x50%+0+0 +repage "c_$f.png"; else cp "$f.png" "c_$f.png"; fi
              files="$files c_$f.png"
            done
            [ -z "$files" ] && return
            montage $files -tile 2x -geometry "$geo+1+1" -background black -quality 50 "$name.jpg"
            echo "=====SHEET $name $(stat -c %s "$name.jpg")"
            base64 -w 0 "$name.jpg"
            echo
          }
          sheet lobby 320x180 0 lobby_main lobby_team_t
          sheet ads1 320x180 1 vm_ak_ads vm_m4_ads vm_awp_ads vm_mp9_ads
          sheet ads2 320x180 1 vm_shotgun_ads vm_mac10_ads vm_glock_ads vm_deagle_ads
          sheet hip 320x180 0 vm_ak vm_awp vm_glock vm_mp9

      - uses: actions/upload-artifact@v4
        with:
          name: preview-shots
          path: shots/*.png
          if-no-files-found: ignore
