name: Dev preview (models check and screenshots)

# Development check for the optics and the lobby with the real character and weapon models (they exist only
# on the build machine). Run it by hand from the Actions tab; the screenshots are in the "preview-shots" artifact.
on:
  workflow_dispatch:
    inputs:
      lobby_shots:
        description: "Commit phone-size lobby screenshots (attackers and defenders) to docs/screenshots on this branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.2"

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          rm -f godot.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null

      - name: Unpack models, animations and sounds from the original game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _orig
          URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].assets[] | select(.name | test("fable.?strike.*\\.(zip|rar|exe|pck)$"; "i"))] | sort_by(.size) | last | .url // empty')"
          test -n "$URL"
          gh api -H "Accept: application/octet-stream" "$URL" > _orig/pack.bin
          SRC="_orig/pack.bin"
          if [ "$(head -c 2 "$SRC")" = "PK" ]; then
            unzip -q -o "$SRC" -d _orig/zip
            rm -f _orig/pack.bin
            SRC="$(find _orig/zip -type f -size +300M \( -iname '*.rar' -o -iname 'FableStrike2.exe' -o -iname '*.pck' \) | head -1)"
          fi
          if [ "$(head -c 4 "$SRC")" = "Rar!" ]; then
            (cd tools/unpack && npm install --no-save --silent node-unrar-js@2.0.2)
            node tools/unpack/unrar.mjs "$SRC" _orig/rar
            SRC="$(find _orig/rar -type f -size +300M -iname 'FableStrike2.exe' | head -1)"
          fi
          "$GODOT" --headless --path tools/unpack --script unpack_assets.gd -- "$PWD/$SRC" "$PWD"
          rm -rf _orig tools/unpack/node_modules

      - name: Import
        run: '"$GODOT" --headless --path . --import > /dev/null 2>&1 || true'

      - name: Screenshots
        run: |
          set -uo pipefail
          mkdir -p shots
          R="xvfb-run -a -s '-screen 0 1280x720x24'"
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x720 -- \
            --nosplash --windowed --mute --nosave --shots shots --quit_menu > shots/lobby.log 2>&1 || true
          grep -c "SHOT" shots/lobby.log || true
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x720 -- \
            --match --vmtest "${VMLIST:-ak,m4,awp,shotgun,mp9,mac10,glock,usp,deagle}" --vmads --windowed --mute --nosave --shots shots > shots/vm.log 2>&1 || true
          grep -E "SHOT|SCRIPT ERROR" shots/vm.log | sort | uniq -c | head -40
          ls shots

      - name: Lobby screenshots, phone size (committed to the branch)
        if: ${{ inputs.lobby_shots }}
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          for team in t ct; do
            rm -rf "lobby_$team"; mkdir -p "lobby_$team"
            timeout 300 xvfb-run -a -s "-screen 0 2340x1080x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 2340x1080 -- \
              --nosplash --windowed --touch --uiscale 1.5 --team "$team" --mute --nosave --shots "lobby_$team" --quit_menu > "lobby_$team.log" 2>&1 || true
            grep -E "\[anims\]" "lobby_$team.log" | head -4 || true
            test -f "lobby_$team/lobby_main.png"
            convert "lobby_$team/lobby_main.png" -quality 88 "docs/screenshots/lobby_$team.jpg"
          done
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Lobby screenshots with the real character models (attackers and defenders)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Weapon geometry and optic placement (last, so the log tail holds it)
        run: '"$GODOT" --headless --path . --script res://tools/preview/dump.gd 2>&1 | grep -vE "^(Godot Engine|$)" | head -400 || true'

      - name: Optic summary
        run: |
          grep -h "SIGHT" shots/*.log 2>/dev/null | cut -c1-400 || true
          for f in shots/lobby.log shots/vm.log; do
            echo "== script errors in $f (by place):"
            grep -A2 "SCRIPT ERROR" "$f" | grep -oE "res://[a-z_/]+\.gd:[0-9]+" | sort | uniq -c | sort -rn | head -12 || true
            grep "SCRIPT ERROR" "$f" | sort | uniq -c | sort -rn | head -6 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: preview-shots
          path: shots/*.png
          if-no-files-found: ignore
