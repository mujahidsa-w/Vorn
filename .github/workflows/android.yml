name: Vexo Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --project-name vexo --org com.vexoapp --platforms android .

      - name: Add Firebase config for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON is missing"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: python3 tools/patch_android.py

      - run: flutter pub get

      - name: Generate app icons
        run: |
          sed -i 's/ios: true/ios: false/' pubspec.yaml
          dart run flutter_launcher_icons

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: vexo-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
