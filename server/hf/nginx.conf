# One public port (7860) for the Hugging Face Space: the master at /m, battle N at /b/N (WebSocket).
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 7860;
    location = / {
      default_type text/html;
      return 200 '<!doctype html><meta charset="utf-8"><title>AURUM MOBILE</title><body style="background:#0b0c10;color:#f2c14e;font:20px sans-serif;text-align:center;padding-top:20vh">AURUM MOBILE — الخادم يعمل ✓</body>';
    }
    location = /m {
      proxy_pass http://127.0.0.1:24600;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
    location ~ ^/b/(246[0-4][0-9])$ {
      proxy_pass http://127.0.0.1:$1;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
